name: Security/privacy review
description: Report a security or privacy design concern without sensitive details.
title: "security: "
labels: ["security", "privacy"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private documents, credentials, exploit payloads, or real personal data.
        For sensitive issues, use private vulnerability reporting if available.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the concern using synthetic examples only.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - policy bypass
        - approval workflow
        - execution boundary
        - workspace boundary
        - audit logging
        - secret redaction
        - adapter behavior
        - documentation claim
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Potential Impact
    validations:
      required: true
  - type: textarea
    id: synthetic_repro
    attributes:
      label: Synthetic Reproduction or Example
      description: Use fake data only.
  - type: textarea
    id: suggested_fix
    attributes:
      label: Suggested Fix
